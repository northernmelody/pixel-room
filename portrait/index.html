<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a23">
  <meta name="description" content="Pixel Room 的三层像素生活小屋。人物、猫和狗按北京时间自主生活。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23d6af6b' d='M2 15 16 3 30 15v15H2z'/%3E%3Cpath fill='%232c3c46' d='M8 16h6v6H8zm11 0h6v6h-6z'/%3E%3C/svg%3E">
  <title>Pixel Room · 竖版小屋</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Pixel Room 竖版小屋"><span class="brand-mark" aria-hidden="true">▥</span><span>PIXEL ROOM<small>生活，住进一栋小屋。</small></span></a>
      <button id="house-menu" class="menu-button" aria-label="打开小屋菜单" type="button">☰</button><span class="edition">PORTRAIT <b>06</b><a class="switch-link" href="../" aria-label="切换到横版 Pixel Room">横版</a></span>
    </header>

    <div class="experience">
      <aside class="intro">
        <span class="eyebrow">A LITTLE HOME</span>
        <h1>楼上的灯，<br>还为你亮着。</h1>
        <p>熟悉的房间，换一种相遇。<br>从床边的吉他，到厨房的小碗，<br>每一层都有生活留下的痕迹。</p>
        <div class="floor-guide" aria-label="楼层分布">
          <p><span>03</span>卧室 <small>晚安，也早安</small></p>
          <p><span>02</span>工作区 · 卫生间 <small>认真与松弛</small></p>
          <p><span>01</span>厨房 · 门区 <small>等一顿热饭</small></p>
        </div>
        <a class="back-link" href="../">← 回到横版房间</a>
      </aside>

      <section class="house-column" aria-label="三层像素小屋预览">
        <div class="scene-frame">
          <div class="scene-caption"><span class="status-dot"></span><span id="scene-caption">夜色里的小屋</span><time id="clock">北京 --:--</time></div>
          <canvas id="house" width="864" height="1800" aria-label="三层像素生活小屋：人物、猫和狗会按自己的节奏活动。点击角色获得当下回应，点击物件查看内容。" tabindex="0"></canvas>
          <div class="loading" id="loading" role="status">正在点亮小屋…</div>
          <div id="item-hint" role="status" aria-live="polite"></div>
        </div>
      </section>


    </div>
  </main>

  <div id="lyrics" class="lyrics" hidden aria-live="polite"></div>
  <dialog id="details" aria-labelledby="details-title"><div class="dialog-head"><span class="eyebrow" id="details-kicker">ROOM OBJECTS</span><button id="close-details" type="button" aria-label="关闭详情">×</button></div><div id="details-content"></div></dialog>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
